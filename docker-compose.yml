services:
  netwatch:
    build: .
    image: netwatch:latest
    restart: unless-stopped
    # Bridge networking, so a reverse proxy (Traefik/Dokploy) can route a
    # domain to port 8080 in the container. For plain local use, add:
    #   ports: ["8080:8080"]
    volumes:
      - netwatch-data:/data
    environment:
      # Hours on the grid follow this time zone.
      TZ: ${TZ:-Asia/Kolkata}
      CHECK_INTERVAL: 30
      PING_TARGETS: 1.1.1.1,8.8.8.8
      # Your router. Must be set: in bridge mode auto-detect finds Docker's gateway.
      GATEWAY: ${GATEWAY:-192.168.0.1}
      SPEEDTEST_ENABLED: 1
      SPEEDTEST_INTERVAL: 3600
      SPEEDTEST_DURATION: 8      # seconds per direction
      SPEEDTEST_STREAMS: 4
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

volumes:
  netwatch-data:
