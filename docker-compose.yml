services:
  netwatch:
    build: .
    image: netwatch:latest
    container_name: netwatch
    restart: unless-stopped
    # Host networking so the container sees the real default gateway (your
    # router) instead of Docker's bridge, and the dashboard is on the host's port.
    network_mode: host
    volumes:
      - ./data:/data
    environment:
      # Hours on the grid follow this time zone.
      TZ: ${TZ:-Asia/Kolkata}
      NETWATCH_PORT: ${NETWATCH_PORT:-8080}
      CHECK_INTERVAL: 30
      PING_TARGETS: 1.1.1.1,8.8.8.8
      # GATEWAY: 192.168.0.1     # set if auto-detection picks the wrong one
      SPEEDTEST_ENABLED: 1
      SPEEDTEST_INTERVAL: 3600
      SPEEDTEST_DURATION: 8      # seconds per direction
      SPEEDTEST_STREAMS: 4
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
